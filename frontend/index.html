<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GetHiredCBS</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
  <header>
    <h1>GetHiredCBS</h1>
    <p>Where CBS alumni work — bubble size = number of alumni there. Click a company for details.</p>
    <label for="industry-filter">Industry</label>
    <select id="industry-filter">
      <option value="">All industries</option>
    </select>
  </header>

  <main>
    <p id="status">Loading…</p>
    <div id="bubbles" class="bubble-field" hidden></div>
  </main>

  <script src="bubbles.js"></script>
</body>
</html>
